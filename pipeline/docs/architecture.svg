<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 590" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a86"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8940A"/>
    </marker>
  </defs>
  <rect width="1500" height="590" fill="#fff"/>

  <text x="2" y="184" font-size="12" fill="#6b6b6b">question</text>
  <line x1="2" y1="196" x2="58" y2="196" stroke="#8a8a86" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="1430" y="186" font-size="13" fill="#6b6b6b">report</text>
  <line x1="1422" y1="196" x2="1490" y2="196" stroke="#8a8a86" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <text x="279" y="40" font-size="13" fill="#6b6b6b" text-anchor="middle">passages, figures and knowledge graph</text>
  <line x1="259" y1="50" x2="259" y2="148" stroke="#8a8a86" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-gray)"/>

  <g stroke="#000" stroke-width="1.5">
    <rect x="60" y="152" width="130" height="88" rx="10" fill="#F9D66B"/>
    <rect x="214" y="152" width="130" height="88" rx="10" fill="#fff"/>
    <rect x="368" y="152" width="130" height="88" rx="10" fill="#F9D66B"/>
    <rect x="522" y="152" width="130" height="88" rx="10" fill="#F9D66B"/>
    <rect x="676" y="152" width="130" height="88" rx="10" fill="#fff"/>
    <rect x="830" y="152" width="130" height="88" rx="10" fill="#F9D66B"/>
    <rect x="984" y="152" width="130" height="88" rx="10" fill="#F9D66B"/>
    <rect x="1138" y="152" width="130" height="88" rx="10" fill="#F9D66B"/>
    <rect x="1292" y="152" width="130" height="88" rx="10" fill="#F9D66B"/>
    <rect x="830" y="340" width="130" height="88" rx="10" fill="#fff"/>
  </g>
  <g font-size="17" text-anchor="middle" fill="#000">
    <text x="125" y="184">Planner</text>
    <text x="279" y="184">Retriever</text>
    <text x="433" y="184">Figure reader</text>
    <text x="587" y="184">Designer</text>
    <text x="741" y="184">Geometry</text>
    <text x="895" y="184">Engineer</text>
    <text x="1049" y="184">Judge</text>
    <text x="1203" y="184">Fabricator</text>
    <text x="1357" y="184">Reporter</text>
    <text x="895" y="372">Tools</text>
  </g>

  <g fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M113,200 l3,3 l5,-6 M126,200 h14 M113,212 l3,3 l5,-6 M126,212 h14 M113,224 l3,3 l5,-6 M126,224 h14"/>
    <circle cx="275" cy="208" r="8"/><path d="M281,214 l9,9"/>
    <path d="M419,200 v26 h28 M423,220 l7,-8 l6,5 l9,-12"/>
    <path d="M573,226 l22,-22 l6,6 l-22,22 z M578,221 l3,3 M583,216 l3,3 M588,211 l3,3"/>
    <path d="M729,206 h20 v20 h-20 z M729,206 l6,-6 h20 l-6,6 M749,226 l6,-6 v-20"/>
    <circle cx="895" cy="213" r="6"/>
    <path d="M895,200 v4 M895,222 v4 M882,213 h4 M904,213 h4 M886,204 l3,3 M901,219 l3,3 M886,222 l3,-3 M901,207 l3,-3"/>
    <path d="M1049,200 v24 M1035,204 h28 M1035,204 l-5,10 h10 z M1063,204 l-5,10 h10 z M1041,226 h16"/>
