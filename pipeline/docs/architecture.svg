  <text x="741" y="262" font-size="13" fill="#6b6b6b" text-anchor="middle">STL of bar and cell</text>
  <text x="1203" y="262" font-size="13" fill="#6b6b6b" text-anchor="middle">recipe and print files</text>
  <text x="818" y="378" font-size="13" fill="#6b6b6b" text-anchor="end">DFT, MD and FEM</text>
  <text x="818" y="396" font-size="13" fill="#6b6b6b" text-anchor="end">one handoff file per tool</text>

  <g stroke="#000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="190" y1="196" x2="212" y2="196"/>
    <line x1="344" y1="196" x2="366" y2="196"/>
    <line x1="498" y1="196" x2="520" y2="196"/>
    <line x1="652" y1="196" x2="674" y2="196"/>
    <line x1="806" y1="196" x2="828" y2="196"/>
    <line x1="960" y1="196" x2="982" y2="196"/>
    <line x1="1114" y1="196" x2="1136" y2="196"/>
    <line x1="1268" y1="196" x2="1290" y2="196"/>
    <line x1="881" y1="242" x2="881" y2="338"/>
    <line x1="909" y1="338" x2="909" y2="242"/>
  </g>
  <text x="871" y="294" font-size="13" fill="#6b6b6b" text-anchor="end">tool call</text>
  <text x="919" y="294" font-size="13" fill="#6b6b6b">result</text>

  <path d="M567,152 C567,96 299,96 299,150" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="433" y="96" font-size="13" fill="#6b6b6b" text-anchor="middle">a field lacks evidence, once</text>
  <path d="M607,152 C607,56 1357,56 1357,150" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="982" y="64" font-size="13" fill="#6b6b6b" text-anchor="middle">a field is still missing</text>
  <path d="M1069,152 C1069,112 1337,112 1337,150" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1203" y="108" font-size="13" fill="#6b6b6b" text-anchor="middle">nothing accepted</text>

  <path d="M1049,242 C1049,590 587,590 587,244" fill="none" stroke="#C8940A" stroke-width="2.5" marker-end="url(#arrow-gold)"/>
  <text x="818" y="520" font-size="13" fill="#6b6b6b" text-anchor="middle">sent back, or accepted below the novelty target, up to 3 candidates</text>

  <g font-size="13" fill="#000">
    <rect x="60" y="556" width="22" height="16" rx="3" fill="#F9D66B" stroke="#000" stroke-width="1.2"/>
    <text x="90" y="569">calls a language model</text>
    <rect x="260" y="556" width="22" height="16" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="290" y="569">runs code</text>
    <line x1="390" y1="564" x2="420" y2="564" stroke="#C8940A" stroke-width="2.5"/>
    <text x="428" y="569">loop back to the designer, driven by the judge and the novelty reward</text>
  </g>
</svg>
