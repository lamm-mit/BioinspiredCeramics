[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# Vendored copy of the fracture-md package (see SOURCE.md). Install with
#   pip install -e tools/md/fracture_md
# The pins are those of fracture-md and match the pipeline (jax 0.11.2, numpy 2.5.3).
[project]
name = "fracture-md"
version = "0.1.0"
description = "JAX atomistic harness for the strength and cleavage of ceramics (vendored from fracture-md)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "Jaime Berkovich" }]
dependencies = [
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "jax-md==0.2.29",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "ase==3.29.0",
    "pymatgen==2026.9.24",
    "spglib==2.7.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
# matscipy is the independent reference implementation (cross-checks only; GPL, not imported by the library code).
reference = ["matscipy==1.3.0"]
viz = ["matplotlib==3.11.2", "pillow==12.3.0"]

[project.scripts]
fracture-md = "fracture_md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
